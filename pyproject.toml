[tool.importlinter]
root_packages = ["astrometricslib", "wayfindinglib", "backend"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "astrometricslib never imports wayfindinglib or backend"
type = "forbidden"
source_modules = ["astrometricslib"]
forbidden_modules = ["wayfindinglib", "backend"]

[[tool.importlinter.contracts]]
name = "wayfindinglib never imports backend"
type = "forbidden"
source_modules = ["wayfindinglib"]
forbidden_modules = ["backend"]

[[tool.importlinter.contracts]]
name = "backend services never import the container or routers"
type = "forbidden"
source_modules = ["backend.services"]
forbidden_modules = ["backend.container", "backend.routers"]

[[tool.importlinter.contracts]]
name = "wayfindinglib uses only the public API of astrometricslib"
type = "forbidden"
source_modules = ["wayfindinglib"]
forbidden_modules = [
    "astrometricslib.api",
    "astrometricslib.drivers",
    "astrometricslib.foundation",
    "astrometricslib.mcp",
    "astrometricslib.models",
    "astrometricslib.pipelines",
    "astrometricslib.utilities",
    "astrometricslib.visualization",
]
allow_indirect_imports = true
ignore_imports = [
    # Tests may reach into internals to build fixtures.
    "wayfindinglib.**.test.** -> astrometricslib.**",
    # Removed in phase 7, when the MCP servers move out of the libraries.
    "wayfindinglib.mcp.__main__ -> astrometricslib.mcp.profile",
    "wayfindinglib.mcp.tool_registry -> astrometricslib.mcp.reflection",
    "wayfindinglib.mcp.tool_registry -> astrometricslib.mcp.tool_registry",
    "wayfindinglib.mcp.__main__ -> astrometricslib.mcp.tool_errors",
]
