# ==============================================================================
# Purpose: Keeps every issue labeled with a subsystem (astrometricslib /
#          wayfindinglib / ui), a component (api / pipelines / drivers /
#          infrastructure), and a type (enhancement / problem) -- and, for
#          anything that isn't a tracking issue, gives it a
#          "type(scope): summary" title and a body with a "Problem /
#          Enhancement" section and an "Acceptance Criteria" section.
#
#          Two jobs. The first reads the dropdown answers a submitter picked
#          in the issue form (.github/ISSUE_TEMPLATE/issue.yml) and applies
#          the matching labels automatically -- this only does anything for
#          issues filed through the web UI, since that form is the only
#          place those dropdowns are rendered.
#
#          The second is the actual backstop: it runs on every issue however
#          it was created, including ones filed with `gh issue create` or
#          the API, which skip the form entirely, and checks the title
#          format, the two required body sections, and the three label
#          groups. Issues carrying the "epic" label (tracking issues with
#          sub-issues, not units of work themselves) are exempt from the
#          title and body checks, but still need the three label groups.
#          If anything is missing, "incomplete" is added and a comment says
#          what; the flag comes off once the issue is fixed. GitHub has no
#          way to block issue creation the way branch protection blocks a
#          merge, so this after-the-fact flag is the closest this repo can
#          get to enforcing it at filing time -- the actual merge-time gate
#          is issue-progress-required.yml.
# ==============================================================================

name: Issue Labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  issues: write

jobs:
  apply-form-labels:
    name: Apply labels from the issue form
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Parse form answers and label the issue
        uses: actions/github-script@v7
        with:
          script: |
            const KNOWN_LABELS = new Set([
              "astrometricslib", "wayfindinglib", "ui",
              "api", "pipelines", "drivers", "infrastructure",
              "enhancement", "problem",
            ]);
            const body = context.payload.issue.body || "";
            // Issue forms render each dropdown as a "### <Label>" heading
            // followed by the selected option(s), comma-separated when the
            // dropdown allows more than one.
            const sectionPattern = /### (Subsystem|Component|Type)\r?\n+([^\n#][^\n]*)/g;
            const found = new Set();
            let match;
            while ((match = sectionPattern.exec(body)) !== null) {
              for (const value of match[2].split(",")) {
                const trimmed = value.trim();
                if (KNOWN_LABELS.has(trimmed)) found.add(trimmed);
              }
            }
            if (found.size === 0) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [...found],
            });

  enforce-issue-shape:
    name: Check labels, title, and required body sections
    runs-on: ubuntu-latest
    needs: apply-form-labels
    if: always()
    steps:
      - name: Check the issue and flag if incomplete
        uses: actions/github-script@v7
        with:
          script: |
            const SUBSYSTEM = ["astrometricslib", "wayfindinglib", "ui"];
            const COMPONENT = ["api", "pipelines", "drivers", "infrastructure"];
            const TYPE = ["enhancement", "problem"];
            const FLAG_LABEL = "incomplete";
            const EPIC_LABEL = "epic";
            // Matches this repo's own commit-prefix convention (doc:,
            // refactor:, new:, fix:, maintenance:), reused here as the
            // issue-title scope prefix: "refactor(config_loader): ...".
            const TITLE_PATTERN = /^(doc|refactor|new|fix|maintenance)\([^)]+\):\s+\S/;

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const current = new Set(issue.labels.map((l) => l.name));
            const body = issue.body || "";

            const missing = [];
            if (!SUBSYSTEM.some((l) => current.has(l))) {
              missing.push(`a subsystem label (${SUBSYSTEM.join(", ")})`);
            }
            if (!COMPONENT.some((l) => current.has(l))) {
              missing.push(`a component label (${COMPONENT.join(", ")})`);
            }
            if (!TYPE.some((l) => current.has(l))) {
              missing.push(`a type label (${TYPE.join(", ")})`);
            }

            if (!current.has(EPIC_LABEL)) {
              if (!TITLE_PATTERN.test(issue.title)) {
                missing.push('a title in the form "type(scope): brief summary", e.g. "refactor(config_loader): ..."');
              }
              const hasSection = (heading) => {
                const pattern = new RegExp(`##+\\s*${heading}\\b[^\\n]*\\n+([^\\n][^\\n]*)`, "i");
                const found = pattern.exec(body);
                return found !== null && found[1].trim().length >= 10;
              };
              if (!hasSection("Problem\\s*/?\\s*Enhancement")) {
                missing.push('a non-empty "Problem / Enhancement" section');
              }
              if (!hasSection("Acceptance Criteria")) {
                missing.push('a non-empty "Acceptance Criteria" section');
              }
            }

            const hasFlag = current.has(FLAG_LABEL);

            if (missing.length > 0) {
              if (!hasFlag) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: [FLAG_LABEL],
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `This issue is missing:\n\n${missing.map((m) => `- ${m}`).join("\n")}\n\nPlease fix it up so this can be triaged.`,
                });
              }
            } else if (hasFlag) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: FLAG_LABEL,
              });
            }
