name: New issue
description: File a bug, enhancement, or task against this repo.
title: "refactor(scope): brief problem or enhancement summary"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe what's wrong or what's missing -- not how to fix it. Where the fix lands
        gets figured out (and written up here) once someone starts the work; this issue is
        for defining the problem and how to know it's solved.

        Every issue also needs three labels: which subsystem it affects, which kind of code
        it touches, and whether it's a new capability or something that needs fixing. A bot
        double-checks the title, the two sections below, and all three labels after you
        submit, and will flag the issue if anything is missing.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of the app does this affect?
      options:
        - astrometricslib
        - wayfindinglib
        - ui
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which kind of code does this touch? Select every option that applies.
      multiple: true
      options:
        - api
        - pipelines
        - drivers
        - infrastructure
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Is this adding a capability that doesn't exist yet, or fixing something that's wrong today?
      options:
        - enhancement
        - problem
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Enhancement
      description: >-
        Define what's wrong or what capability is missing. Describe the symptom and where
        it currently lives if that helps -- don't prescribe which files should change or
        where the fix should go.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: A checklist of concrete, testable conditions for calling this done.
      value: |
        - [ ]
    validations:
      required: true
