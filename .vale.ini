# Vale prose linter for the library documentation.
# Rules: build/documentation/vale/styles/Astrometrics/ (see documentation/Documentation_Conventions.md).
# Run: build/documentation/lint_docs.sh
StylesPath = build/documentation/vale/styles
MinAlertLevel = error

[formats]
mdx = md

[*.md]
BasedOnStyles = Astrometrics
# Math, hidden comments and code are not prose.
BlockIgnores = (?s)\$\$.*?\$\$
TokenIgnores = (\$[^$\n]+\$), (Data Centre)

# Reference lists quote titles verbatim, in their original spelling.
# Each paper wraps its References section in <!-- vale off --> / <!-- vale on -->.

# The register records results in the first person ("Our result").
[documentation/library_design/validation/*.md]
Astrometrics.FirstPerson = NO
