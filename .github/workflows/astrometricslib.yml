# ==============================================================================
# Purpose: GitHub Actions workflow for astrometricslib unit testing and code coverage reporting.
# ==============================================================================

name: astrometricslib CI

on:
  push:
    branches: [ main, master ]
    paths: &paths
      - 'astrometricslib/**'
      - 'pyproject.toml'
      - 'build/linux/run_tests.sh'
      - 'build/linux/setup_venv.sh'
      - '.github/actions/setup-python-env/**'
      - '.github/workflows/astrometricslib.yml'
  pull_request:
    branches: [ main, master ]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run astrometricslib Tests
    # ubuntu-26.04, not ubuntu-latest: this job installs INDI via
    # setup-python-env, and the INDI Stable Builds PPA now publishes the
    # core libindi packages only for the resolute (26.04) series. On
    # noble, apt silently falls back to Ubuntu universe's libindi 1.9.9,
    # which pyindi-client 2.x cannot load.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Run Unit Tests with Coverage
        env:
          PYTHONPATH: .
          ASTROMETRICS_TESTING: "1"
          ASTROMETRICS_FAST_TEST: "1"
          # setup_venv.sh treats a failed _extractor_c.c compile as a
          # non-fatal warning (some dev machines lack a C toolchain), so
          # without this a broken build would just silently skip
          # test_extractor_c_equivalence.py instead of failing CI.
          ASTROMETRICS_REQUIRE_C_EXTENSION: "1"
        run: |
          COVERAGE=1 ./build/linux/run_tests.sh astrometricslib

      - name: Comment PR with Code Coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBPROJECT_ID: "astrometricslib"
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
