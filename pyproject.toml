# ==============================================================================
# Purpose: PyProject configuration file for Python tooling options in Astrometrics.
# ==============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrometrics"
version = "0.2.0"
description = "Integrated image processing, photometry, spectroscopy, and telescope control for amateur astronomy and citizen science."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Coelho", email = "macoelho25@gmail.com" }]
keywords = [
    "astronomy",
    "astrophotography",
    "photometry",
    "spectroscopy",
    "astrometry",
    "telescope-control",
    "indi",
    "citizen-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# 3.14 is the floor, not a preference: the codebase uses PEP 758
# parenthesis-less multi-exception `except A, B:` in 50 places, which is a
# SyntaxError on 3.13 and earlier. CI pins 3.14 in
# .github/actions/setup-python-env.
requires-python = ">=3.14"
dependencies = [
    "astroalign", # star-field registration (no shared WCS needed) for spectral_star_registration.py
    "astropy",
    "astroquery",
    "coverage",
    "customtkinter",
    "datamodel-code-generator",
    "fastapi",
    "import-linter",
    "matplotlib",
    "mcp>=1.28.0,<2.0.0", # tool_registry.py reads Tool.inputSchema (camelCase); 1.x only, 2.0 renamed it to input_schema
    "numpy",
    "photutils",
    "Pillow",
    "pydantic>=1.10",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "rawpy",
    "scipy",
    "setuptools",
    "tk",
    "tksheet",
    "tomlkit", # format-preserving TOML read/write for astrometrics.config.toml
    "uvicorn",
    "websockets",
    "psutil",
    "pandas",
    "prov", # W3C PROV-XML export/validation for ProvenanceStore.export_target_lineage_as_prov_xml
    "lxml", # validates exported PROV-XML against the vendored W3C schema in tests
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "ruff>=0.16.0",
    "safety>=3.0.0",
    "pyinstaller",
    # Type checker configured by pyrefly.toml. Previously that config was
    # orphaned -- pyrefly was declared nowhere, so it never ran.
    "pyrefly>=1.2.0",
    # Runs the hooks in .pre-commit-config.yaml. Activate them in a clone with
    # `pre-commit install`; the hook is per-clone and not carried by git.
    "pre-commit>=4.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "sphinx-automodapi>=0.16.0",
    "numpydoc>=1.6.0",
    "myst-nb>=1.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
    "sphinxcontrib-mermaid>=0.9.0",
    "ipywidgets>=8.1.8"
]



[project.urls]
Homepage = "https://github.com/m1chae2/astrometrics"
Documentation = "https://github.com/m1chae2/astrometrics/tree/main/documentation"
Repository = "https://github.com/m1chae2/astrometrics"
Issues = "https://github.com/m1chae2/astrometrics/issues"

[project.scripts]
astrometrics = "backend.main_backend:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend", "astrometricslib", "wayfindinglib"]
exclude = [
  "backend/tests",
  "astrometricslib/test",
  "wayfindinglib/test",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "astrometricslib/test", "astrometricslib/foundation", "wayfindinglib/test", "build/migrations"]
pythonpath = ["."]
addopts = "-v -m 'not trio'"
markers = [
    "anyio: mark test to run with anyio",
    "trio: mark test as trio-only (skip if trio not installed)"
]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
relative_files = true

[tool.ruff]
target-version = "py314"
line-length = 110
preview = true

extend-exclude = [
    "node_modules",
    "dist",
    "coverage",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: flags broken formatting -- spacing, indentation, line length -- so code looks the same everywhere.
    "W",   # pycodestyle: the same kind of formatting slip as "E", flagged as a warning rather than a hard error.
    "F",   # pyflakes: catches real bugs -- unused imports, unused variables, names that were never defined.
    "I",   # isort: keeps imports sorted and grouped the same way everywhere, so reordering them doesn't clutter every diff.
    "B",   # flake8-bugbear: catches Python mistakes that look fine but usually aren't, like a mutable default argument.
    "UP",  # pyupgrade: flags old syntax that has a cleaner modern equivalent, so the code keeps pace with the Python version it targets.
    "C4",  # flake8-comprehensions: flags comprehensions written the long way and suggests the simpler, more readable form.
    "RUF", # Ruff's own extra checks, for mistakes the tools above don't cover.
    "N",   # pep8-naming: enforces naming conventions -- classes in PascalCase, functions/variables in snake_case -- so a name's casing alone says what kind of thing it is.
    "D",   # pydocstyle: requires every public function and class to have a docstring, written in the numpydoc format this project follows.
    "doc-line-too-long", # pycodestyle: keeps docstring/comment lines from running past 79 characters, so long explanations stay readable without side-scrolling.
    "DOC", # pydoclint: checks a docstring's claims (parameters, return value, exceptions raised) against what the function actually does, so docs can't silently drift out of sync with the code.
    "TID", # flake8-tidy-imports: blocks importing astrometricslib's internal subpackages directly, so everyone goes through the one supported top-level `astrometricslib` import.
    "S",   # flake8-bandit: flags common security mistakes -- unsafe subprocess calls, hardcoded passwords, weak hashes like MD5 -- before they ship.
    "ANN", # flake8-annotations: requires type hints on functions, since a function with no type hints is invisible to the type checker (pyrefly).
    "BLE", # flake8-blind-except: flags `except Exception`, which hides the cause of a failure. Catch the specific error, or handle it at a boundary.
    "TRY", # tryceratops: flags exception handling that loses the traceback or raises long messages inline.
    "LOG", # flake8-logging: flags wrong uses of the logging module, such as an invalid logger or a bad `extra` key.
    "G",   # flake8-logging-format: flags f-strings and `%` in logging calls, which build the message even when it is filtered out.
    "T20", # flake8-print: flags `print` in library code. Programs write output through logging.
]
ignore = [
    "ambiguous-unicode-character-string", # astronomical notation (', degree/prime/double-prime, x) is intentional
    "ambiguous-unicode-character-docstring", # same
    "ambiguous-unicode-character-comment", # same
    "incorrect-blank-line-before-class", # conflicts with one-blank-line-before-class
    "multi-line-summary-second-line", # conflicts with multi-line-summary-first-line
    "raise-vanilla-args", # TRY003: long messages are fine; the error model sets their wording
    "try-consider-else", # TRY300: style only
    "raise-within-try", # TRY301: style only
    "type-check-without-type-error", # TRY004: style only
    "any-type", # ANN401: dynamic payloads (INDI properties, notebook cell outputs, JSON) are legitimately Any
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.isort]
known-first-party = ["astrometricslib", "wayfindinglib", "backend"]

# Enforces the astrometricslib public-API boundary documented in
# astrometricslib/api/__init__.py: everything outside astrometricslib
# itself must import from the top-level `astrometricslib` namespace,
# never from its internal subpackages. Exempted for astrometricslib's
# own modules via per-file-ignores below, since Layer 1 (`api/`) is
# meant to reach into its own lower layers directly.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"astrometricslib.api".msg = "Internal. Import from the top-level `astrometricslib` namespace instead."
"astrometricslib.models".msg = "Internal. Import from the top-level `astrometricslib` namespace instead."
"astrometricslib.utilities".msg = "Internal. Import from the top-level `astrometricslib` namespace instead."
"astrometricslib.pipelines".msg = "Internal. Use the facade on `Astrometrics` instead."
"astrometricslib.drivers".msg = "Internal. Use the facade on `Astrometrics` instead."
"astrometricslib.foundation".msg = "Internal. Import from the top-level `astrometricslib` namespace instead."
"astrometricslib.visualization".msg = "Internal. Use `Astrometrics.visualization` instead."
"wayfindinglib.drivers".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.tasks".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.models".msg = "Internal. Import the model from the top-level `wayfindinglib` namespace instead."
"wayfindinglib.analytics".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.session_analysis".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.data_access".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.observationlib".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.observatorylib".msg = "Internal. Use the `Wayfinder` API instead."
"wayfindinglib.watchdog".msg = "Internal. The watchdog must not be imported by what it watches."
"logging.basicConfig".msg = "Only a program's entry point configures logging. Call the shared logging setup instead."

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["assert", "hardcoded-temp-file"] # S101/S108: assert is the pytest idiom; /tmp/... strings here are mock config defaults, never actually written to
"**/conftest.py" = ["assert"] # S101, same reasoning
"**/scripts/**" = ["print"] # T201: a script is a program; its output is for the person who ran it
"build/**" = ["print"] # T201: build tools are programs
"backend/services/observatory/guiding_service.py" = ["suspicious-non-cryptographic-random-usage", "banned-api", "blind-except", "error-instead-of-exception", "logging-f-string"] # S311: simulated guide-star telemetry jitter for the mock/simulator, not security-sensitive
# S404/S603/S607: this app is a telescope-control/imaging tool that
# legitimately shells out to external CLIs (Siril, astrometry.net,
# ssh/rsync/scp to remote StellarMate boxes). Reviewed: every call site uses
# list-form args (never shell=True, never a string built by interpolating
# untrusted input into a shell command), which is the safe subprocess pattern.
"astrometricslib/drivers/siril_interface.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path", "blind-except", "error-instead-of-exception", "logging-exc-info", "logging-f-string"]
"astrometricslib/scripts/spectral_registration_quality_analysis.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "blind-except"]
"astrometricslib/pipelines/stacking/post_processing/stack_preview.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]
"astrometricslib/drivers/siril_stacking_engine.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]
"astrometricslib/drivers/plate_solve_interface.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "blind-except", "logging-f-string"]
"backend/mcp/mcp_diagnostics.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path", "blind-except"]
"backend/mcp/tool_registry.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path", "blind-except", "logging-f-string"]
"backend/mcp/tools/developer_tools.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "hardcoded-temp-file", "blind-except"] # S108: "/tmp" is an allowlist prefix for the sandbox boundary check, not a path being written to
"backend/mcp/tools/diagnostics.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "blind-except"]
"backend/services/infrastructure/system_status_service.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path", "banned-api", "blind-except", "print"]
"backend/services/infrastructure/handoff_service.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "blind-except"]
"wayfindinglib/drivers/stellarmate_interface.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "blind-except", "error-instead-of-exception", "logging-f-string"]
"astrometricslib/drivers/test/test_target_records.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]
"astrometricslib/test/test_scripts.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import"]
# These stand in for a Siril process without needing Siril installed, using
# `true`/`sleep` off PATH like any other list-form subprocess call in this
# codebase (never shell=True, never interpolated).
"astrometricslib/drivers/test/test_siril_command_synchronisation.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path"]
"astrometricslib/drivers/test/test_siril_process_target_pipe_timeout.py" = ["subprocess-without-shell-equals-true", "suspicious-subprocess-import", "start-process-with-partial-path"]
# S608: these all bind values through parameterized `?` placeholders; the
# only f-string interpolation is a code-defined table name (from a registry
# constant, never a request body or user text field) or, for the Gaia ADQL
# queries, numeric coordinates formatted as floats -- neither can carry a
# string value that escapes the query.
"astrometricslib/foundation/storage/butler.py" = ["hardcoded-sql-expression"]
"astrometricslib/drivers/local_database.py" = ["hardcoded-sql-expression", "blind-except", "error-instead-of-exception", "logging-f-string", "verbose-raise"]
"astrometricslib/drivers/logger_interface.py" = ["hardcoded-sql-expression", "blind-except", "error-instead-of-exception", "logging-f-string", "verbose-raise"]
"astrometricslib/pipelines/astrometry/processing/star_identifier.py" = ["hardcoded-sql-expression", "blind-except", "error-instead-of-exception", "logging-f-string"]
"wayfindinglib/drivers/local_database.py" = ["hardcoded-sql-expression", "error-instead-of-exception", "logging-f-string", "verbose-raise"]
"wayfindinglib/drivers/catalog/gaia_catalog_driver.py" = ["hardcoded-sql-expression"]
"wayfindinglib/drivers/catalog/local_bright_star_catalog_driver.py" = ["hardcoded-sql-expression"]
"__init__.py" = ["unused-import"] # re-exports for package public API
"astrometricslib/__init__.py" = ["non-empty-init-module"] # Astrometrics facade class is intentionally defined here
"wayfindinglib/__init__.py" = ["non-empty-init-module"] # Wayfinder facade class is intentionally defined here
"wayfindinglib/**" = ["banned-api"] # wayfindinglib reaches into its own layers; its use of astrometricslib is checked by import-linter
"astrometricslib/**" = ["banned-api"] # Layer 1 (api/) and lower layers reach into each other directly by design
"build/codegen/generate_types.py" = ["banned-api"] # TS codegen introspects the full model surface, not just the public API
"astrometricslib/conftest.py" = ["module-import-not-at-top-of-file"] # sys.modules mocking/config patching must precede import
"astrometricslib/mcp/__main__.py" = ["module-import-not-at-top-of-file"] # sys.path bootstrap must precede import
"wayfindinglib/mcp/__main__.py" = ["module-import-not-at-top-of-file"] # sys.path bootstrap must precede import
"backend/tests/conftest.py" = ["module-import-not-at-top-of-file"] # sys.modules mocking/config patching must precede import
"backend/main_backend.py" = ["module-import-not-at-top-of-file", "banned-api", "blind-except", "error-instead-of-exception", "exc-info-outside-except-handler", "logging-f-string"] # warnings.filterwarnings() must precede import
"backend/mcp/__main__.py" = ["module-import-not-at-top-of-file", "banned-api", "blind-except", "error-instead-of-exception", "logging-f-string", "root-logger-call"] # sys.path bootstrap must precede import
"wayfindinglib/drivers/indi_interface.py" = ["invalid-function-name", "blind-except", "logging-f-string", "print"] # overrides PyIndi's C++ client interface (camelCase required)
"wayfindinglib/drivers/indi/pyindi_compatibility.py" = ["invalid-function-name"] # stub mocks the same PyIndi camelCase interface
"wayfindinglib/drivers/simulators/indi_simulator.py" = ["invalid-function-name"] # mocks the same PyIndi camelCase interface
"wayfindinglib/drivers/indi/test/test_mount_controller.py" = ["invalid-function-name"] # fake telescope device mocks PyIndi's camelCase getNumber
"wayfindinglib/drivers/test/test_indi_property_dispatch.py" = ["invalid-function-name"] # recording client overrides the same PyIndi camelCase callbacks
"wayfindinglib/drivers/indi/test/test_enclosure_controller.py" = ["invalid-function-name"] # fake enclosure device/client mocks PyIndi's camelCase interface
