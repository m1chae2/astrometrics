# ==============================================================================
# Purpose: Weekly check that external links in the documentation still work.
# Runs Sphinx's linkcheck builder on a schedule. It reports dead or moved links
# without blocking pull requests, because outside sites change on their own.
# ==============================================================================

name: Documentation Link Check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# The job only reads the repository and uploads its report.
permissions:
  contents: read

jobs:
  linkcheck:
    name: Check External Links
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Run Sphinx Linkcheck
        run: sphinx-build -b linkcheck documentation documentation/_build/linkcheck

      - name: Upload Linkcheck Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkcheck-report
          path: documentation/_build/linkcheck/output.txt
