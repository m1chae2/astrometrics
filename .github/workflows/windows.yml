# ==============================================================================
# Purpose: Run the test suites on a Windows runner.
#
# Ubuntu is the main system and its own workflows stay the main check. This
# workflow runs the same Python suites on Windows, so a change that works on
# Linux but breaks on Windows (a path written with "/", a symbolic link, a
# Linux-only call such as os.nice or os.kill(pid, 0)) is caught before it
# merges. Tests of Linux-only parts (the simulator, the TPM harness, INDI,
# Siril's FIFOs) are not collected on Windows, and single tests of Linux-only
# behavior carry a `linux_only` marker; the root conftest.py lists both, with
# their reasons. The frontend job runs the Windows-sensitive UI tests.
# ==============================================================================

name: windows CI

on:
  push:
    branches: [ main, master ]
    paths: &paths
      - 'astrometricslib/**'
      - 'wayfindinglib/**'
      - 'backend/**'
      - 'mcp_servers/**'
      - 'build/mcp/**'
      - 'build/windows/**'
      - 'electron/**'
      - 'ui/common/fitsViewer/**'
      - 'ui/tests/test_platformAdapters.test.ts'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [ main, master ]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs only read the repository.
permissions:
  contents: read

jobs:
  python:
    name: Run Windows Python Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      # The same install as build/windows/setup_windows.ps1, plus the dev
      # extra for the test tools. No INDI: it is not available on Windows.
      - name: Install the project
        run: |
          python -m pip install --upgrade pip hatchling editables setuptools_scm Cython numpy
          python -m pip install --no-build-isolation -e ".[mcp,dev]"

      # The whole suite, as on Linux, with one worker per processor core.
      - name: Run the test suites
        timeout-minutes: 60
        env:
          PYTHONPATH: .
          ASTROMETRICS_TESTING: "1"
        run: python -m pytest -n auto -q -p no:cacheprovider -o addopts="" -m "not trio" -rfE

  frontend:
    name: Run Windows Frontend Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # --ignore-scripts: the "prepare" script is POSIX shell, which Windows
      # cannot run (build/windows/setup_windows.ps1 does the same).
      - name: Install Node packages
        run: npm ci --ignore-scripts

      - name: Run the Windows-sensitive tests
        run: npx vitest run ui/tests/test_platformAdapters.test.ts ui/common/fitsViewer/tests/test_canvasDrawerScaling.test.tsx --coverage.enabled=false
