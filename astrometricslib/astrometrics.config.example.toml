# Astrometrics configuration template.
#
# build/linux/setup_venv.sh copies this file to astrometrics.config.toml on
# first run if no configuration exists yet. astrometrics.config.toml itself
# is excluded from version control because it holds machine-specific paths
# and an astrometry.net API key; edit the copy, not this template.
#
# Every value below is a working default for the standard install
# (build/linux/install_ubuntu_deps.sh with no options), except the two
# marked EDIT ME. Installing Siril from Flatpak instead requires the two
# changes noted under ["Processing.Siril"].
#
# Format note: this file is TOML, not INI. Every section name is written as
# a single quoted string (e.g. ["Observatory.Camera.Nikon D5300"]) rather
# than real nested tables, so it reads the same as it always did -- the dots
# are just part of the section's name, not real nesting. Plain values are
# quoted strings, same as before. The one real difference is the camera
# sections below, which now hold inline tables like
# `clip_ceiling_adu = { value = 65532.0, kind = "measured", source = "..." }`
# -- see the comment above ["Observatory.Camera.Nikon D5300"] for what these
# mean and how to add a camera of your own.

["Image Library"]
# EDIT ME: absolute path to your own library. Captured frames always
# live in a "frames" subfolder underneath this path.
path = "./library"
# OPTIONAL: where stacks, group stacks, rejection maps, previews and processed
# pictures are written, under <stacks_path>/lights/<target>/. Leave it out to
# keep them beside the raw frames. Set it to put the large raw frames on one
# disk (for example a shared Windows partition) and the pipeline's output on
# another.
# stacks_path = "/home/you/Astrometrics/stacks"
# OPTIONAL: the folder where the raw frames' drive must be mounted, for frames
# kept on a USB disk or a network share (NAS). While nothing is mounted there,
# downloads and file sorting stop with an error. Without this check, they would
# write the frames into the empty folder on your own disk. Leave it out for a
# frames folder on your own disk.
# frames_mount_point = "/mnt/nas"

["Observatory.Filters"]
# Filters this observatory's filter wheel is actually loaded with, as
# FilterType member names (see astrometricslib/utilities/enums.py).
available = "NONE, L, SPEC"

["Observatory.Telescope"]
hostname = "localhost"
focal_length_mm = "405"
focal_ratio = "5.4"
indi_port = "7624"
remote_pictures_path = "/home/stellarmate/Pictures"

["Observatory.Location"]
# Where the observatory is. It decides which stars are up and when they rise
# and set. Without it, the planning tools use a default site (Denver) and log
# a warning, so every altitude, rise time and set time is wrong for any other
# place. Remove the leading # from the three lines and put in your own values.
#   latitude  = degrees, north is positive
#   longitude = degrees, east is positive (west is negative)
#   elevation = metres above sea level, or 0 if you do not know it
# latitude = "45.0"
# longitude = "-110.0"
# elevation = "0"

["Observatory.Optics"]
# Every telescope or camera lens you use, by name. The name is stored as the
# "telescope" of each frame, so it decides which flat frames are used and
# which library folder a frame goes in. Each name needs its own
# ["Observatory.Optic.<name>"] section below.
available = "Apertura 75Q, Nikkor 300mm"

["Observatory.Optic.Apertura 75Q"]
focal_length_mm = "405"
focal_ratio = "5.4"

["Observatory.Optic.Nikkor 300mm"]
focal_length_mm = "300"
focal_ratio = "5.6"

["Observatory.Setups"]
# The camera-and-optic pairings you really use. A camera may appear in
# several setups (the D5300 below), and an optic may be used by several
# cameras (the Apertura below). Each name needs its own
# ["Observatory.Setup.<name>"] section.
#
# A frame's optic is chosen from the setups that use its camera: first by
# matching the FOCALLEN in its header to an optic's focal_length_mm (within
# 2%), then, when the header has no FOCALLEN, by the camera's only setup, then
# by an optic's name appearing in the file path. Otherwise it is "Unknown",
# and a warning is logged.
available = "ASI533 on Apertura, D5300 on Apertura, D5300 on Nikkor"

["Observatory.Setup.ASI533 on Apertura"]
camera = "ZWO ASI533MM Pro"
optic = "Apertura 75Q"

["Observatory.Setup.D5300 on Apertura"]
camera = "Nikon D5300"
optic = "Apertura 75Q"

["Observatory.Setup.D5300 on Nikkor"]
camera = "Nikon D5300"
optic = "Nikkor 300mm"

["Observatory.Constraints"]
min_altitude = "0.0"
max_altitude = "90.0"

["Observatory.Camera"]
models = "Nikon D5300, ZWO ASI533MM Pro, ZWO ASI120MC-S"
default_primary_camera = "ZWO ASI533MM Pro"
default_secondary_camera = "ZWO ASI120MC-S"

# --- Camera profiles -------------------------------------------------------
#
# Each camera section below holds two kinds of fact together: per-setup
# facts (pixel size, sensor dimensions, grating geometry -- true for your
# specific rig) and per-model facts (clip_ceiling_adu, saturation_threshold_adu,
# photometric_linearity_limit_adu, quantum_efficiency -- true for anyone who
# owns that exact camera model). The model-level facts are written as inline
# tables with three parts:
#   value = the number itself
#   kind  = "datasheet" (read from the manufacturer's published spec/graph),
#           "measured" (a real measurement, on this library's own frames or
#           in a paper), or "assumed" (nobody has checked it -- prefer
#           replacing these with a measured value when the chance comes up)
#   source = a short note on where the number actually came from
#
# To add a camera of your own: copy one of the sections below, rename it to
# ["Observatory.Camera.<your camera's name>"], and fill in every field with
# its own value and provenance. `name_aliases` (optional, comma-separated)
# lists other spellings that show up in your FITS headers -- case, spaces,
# and punctuation are ignored when names are compared, so you only need an
# alias for a genuinely different spelling. `record_name` (optional) is the
# spelling frame records and library folder names should use, if you want it
# to differ from whatever your FITS header says.

["Observatory.Camera.Nikon D5300"]
name = "Nikon D5300"
name_aliases = "Nikon DSLR DSC D5300"
record_name = "Nikon DSLR DSC D5300"
"pixel_size_μm" = "3.89"
sensor_width_px = "6000"
sensor_height_px = "4000"
grating_distance_mm = "75"
sensor_min_wavelength = "350"
sensor_max_wavelength = "900"
# The ISO to record for an image whose header has neither ISOSPEED nor GAIN.
# An ISO that the header does give is always used instead.
default_iso = "800"
clip_ceiling_adu = { value = 16383.0, kind = "measured", source = "Maximum of saturated raw frames in this library. The sensor is 14-bit, so a clipped frame reaches 16383." }
# OPEN QUESTION: this threshold sits above the clip ceiling of 16383, so a
# saturated pixel could never reach it, and saturation checks that use it
# would always report none for raw D5300 frames read at their native 14-bit
# scale. Not yet checked against real D5300 frames. Kept as it was so
# behavior does not change while this is unresolved.
saturation_threshold_adu = { value = 65000.0, kind = "assumed", source = "Long-standing pipeline default for raw frames: just under the 16-bit maximum of 65535. Never measured per camera." }

["Observatory.Camera.ZWO ASI533MM Pro"]
name = "ZWO ASI533MM Pro"
name_aliases = "ZWO CCD ASI533MM Pro"
record_name = "ZWO ASI 533MM Pro"
"pixel_size_μm" = "3.76"
sensor_width_px = "3008"
sensor_height_px = "3008"
sensor_min_wavelength = "300"
sensor_max_wavelength = "1000"
dispersion_orientation = "vertical"
dispersion_direction = "positive"
grating_lines_per_mm = "200"
dispersion_offset_x = "0.0"
clip_ceiling_adu = { value = 65532.0, kind = "measured", source = "Maximum of saturated raw frames in this library. The sensor is 14-bit, stored as 16-bit in steps of 4, so a clipped frame reaches 65532." }
saturation_threshold_adu = { value = 65000.0, kind = "assumed", source = "Long-standing pipeline default for raw frames: just under the 16-bit maximum of 65535. Never measured per camera." }
photometric_linearity_limit_adu = { value = 60000.0, kind = "measured", source = "Antonov 2026: the response turns non-linear above about 60,000 ADU at Gain 0 / Offset 10, before hard clipping." }
quantum_efficiency = { wavelength_nm = [400.0, 420.0, 440.0, 460.0, 480.0, 500.0, 520.0, 550.0, 600.0, 650.0, 700.0, 750.0, 800.0, 850.0, 900.0, 950.0, 1000.0], quantum_efficiency_fraction = [0.7, 0.82, 0.88, 0.91, 0.92, 0.9, 0.89, 0.88, 0.78, 0.62, 0.48, 0.36, 0.27, 0.19, 0.13, 0.08, 0.06], kind = "datasheet", source = "Read off the sensitivity graph published by ZWO." }
# Optional. The wavelength, in nm, that calibration treats as the start of
# the spectrum. Leave it out to use the default of 380.
# extraction_start_wavelength_nm = "380"
# CALCULATED -- everything below this line, and only what's below this
# line, is fitted from a calibration frame by
# SpectroscopyCalibrationTuner.tune_calibration()
# (astrometricslib/pipelines/spectroscopy/utilities/calibration_tuner.py)
# and overwritten on every re-run. Don't hand-edit these; re-run calibration
# instead. The values below are this camera's own last calibration
# result, kept as a working starting point.
grating_distance_mm = "16.49"
dispersion_start_px = "334.4"
# True if the calibration frame showed the star's own flare/astigmatism
# still saturating the pixels where extraction begins.
use_flare_mask_extraction = "true"
# Only present when the calibration frame showed the physics-derived
# extraction length running past the usable sensor area; absent means
# uncapped.
max_extraction_length_px = "750.0"

["Observatory.Camera.ZWO ASI120MC-S"]
name = "ZWO ASI120MC-S"
name_aliases = "ZWO CCD ASI120MC-S"
"pixel_size_μm" = "3.75"
sensor_width_px = "1280"
sensor_height_px = "960"
grating_distance_mm = "0"
sensor_min_wavelength = "400"
sensor_max_wavelength = "700"
clip_ceiling_adu = { value = 65532.0, kind = "assumed", source = "Never measured on this camera. It is the value the pipeline used for any camera whose name contains ZWO, before camera profiles existed." }
saturation_threshold_adu = { value = 65000.0, kind = "assumed", source = "Long-standing pipeline default for raw frames: just under the 16-bit maximum of 65535. Never measured per camera." }

# The fallback profile used for any camera without its own section above.
# Results computed with this profile rest on assumptions about the sensor
# and should be treated with care. Exactly one camera section must have
# is_generic_fallback = "true".
["Observatory.Camera.Generic unlisted camera"]
name = "Generic unlisted camera"
is_generic_fallback = "true"
clip_ceiling_adu = { value = 65535.0, kind = "assumed", source = "The top of a 16-bit range. What the pipeline used for a camera it did not recognise, before camera profiles existed." }
saturation_threshold_adu = { value = 65000.0, kind = "assumed", source = "Long-standing pipeline default for raw frames: just under the 16-bit maximum of 65535." }

["Processing.Astrometry.Online Solver"]
# EDIT ME: your astrometry.net API key, from
# https://nova.astrometry.net/api_help. Plate solving needs either this key
# or the local solver below; the standard install provides neither, so set
# one of the two before running astrometry. Leaving this blank falls back to
# the local solver, which requires installing it first with
# build/linux/install_ubuntu_deps.sh --with-local-solver.
api_key = ""

["Processing.Astrometry.Local Solver"]
index_path = "/usr/share/astrometry"
autoindex = "true"
cpulimit = "300"

["Processing.GraXpert"]
# Optional. The command that starts GraXpert (https://graxpert.com), the
# program that removes the sky's brightness gradient. When set, each finished
# stack's preview picture is flattened with GraXpert before Siril stretches it.
# Leave blank to skip that step. The stack file is never changed either way.
# Example: /opt/GraXpert-linux/GraXpert
graxpert_executable = ""

["Processing.CosmicClarity"]
# Optional. The path of Cosmic Clarity's denoise program (SetiAstro, free,
# https://www.setiastro.com/cosmic-clarity), for example
# /opt/CosmicClaritySuite_Linux/SetiAstroCosmicClarity_denoise.
# When set, each finished stack's preview picture is denoised with it after
# Siril stretches it. Leave blank to skip that step. The program reads and
# writes the "input" and "output" folders next to itself, so keep those
# folders free of other files. The stack file is never changed either way.
denoise_executable = ""
# How strongly to remove noise, from 0 (none) to 1 (full). On the M 101, M 57,
# NGC 4438 and M 81 stacks, 0.9 cut the sky grain by 14-39% compared with
# 0.75, raised the ratio of structure to grain by 17-63%, and left the peak
# brightness of 300 mid-bright stars unchanged. On the M 13 stack, 0.5 left
# visible grain. Judged by eye on M 13 and by measurement on the four others,
# with the denoise run after the stretch. Not tested above 0.9 on more than
# one target.
denoise_strength = "0.9"

["Processing.Siril"]
# Match this to whichever --siril-source you passed to
# build/linux/install_ubuntu_deps.sh (the script prints the right value
# when it finishes; it does not edit this file for you):
#   apt (default):  siril-cli
#   flatpak:        flatpak run --command=siril-cli org.siril.Siril
# Either way, use the -cli entry point, not plain "siril" or
# "flatpak run org.siril.Siril" -- those launch the GUI build, which
# needs a display connection even for headless pipe-mode stacking.
siril_executable = "siril-cli"
# Blank by default, because the default apt install cannot use it:
# weighting requires a Siril new enough to support `stack`'s -weight=
# argument, and Ubuntu's package (1.2.1) is not, so stacking fails with
# "Unexpected argument to stacking `-weight=wfwhm'". If you installed via
# --siril-source=flatpak (see build/linux/install_ubuntu_deps.sh), set
# this to wfwhm to weight each frame by its measured star sharpness.
stack_weight = ""
# The fewest frames a master bias, master dark or master flat should be built
# from. The stacker averages the frames and throws out odd pixel values (cosmic
# ray hits). One frame keeps its own noise and its cosmic ray hits, and two
# frames cannot tell a good value from a bad one; three can. A master built
# from fewer frames is still built, but the stack is flagged with the
# "calibration_frame_count" gate and says which master was short. The default
# is 3.
minimum_calibration_frames = "3"
# Several exposure lengths in one stack are stacked one length at a time, then
# put on one brightness scale and combined. The scale is measured on mid-range
# pixels and checked on the brightest pixels. A camera that is linear gives the
# same ratio both ways. This is how far the two may differ, as a fraction of
# the mid-range ratio, before that exposure group is left out of the combined
# image and the stack is flagged (a bright end that is compressed near full
# well, or clipped, makes them differ). The default is 0.05, which is 5%.
exposure_group_gain_tolerance = "0.05"
# "true" (the default): before each stack of light frames, measure the frames
# and move the ones with clouds or trailed stars into a folder named
# "_excluded" beside them. Frames are moved, never deleted; the folder holds
# excluded_frames.json (why each was moved), and
# astrometricslib/scripts/restore_excluded_frames.py moves them back. Set
# "false" to leave every frame where it is.
quarantine_bad_frames_enabled = "true"
# "true" (the default): the stack preview picture dims stars in proportion to
# their brightness and softens the brightest values, so stars no longer look
# like equally bright white dots. The stack file itself is never changed. Set
# "false" for the plain stretched picture.
preview_star_tone_enabled = "true"
# "true" (the default): before a restack replaces a stack, move the old stack
# and its pictures into a folder named "_previous" beside it, so the two can be
# compared. Only one previous version is kept; the next restack replaces it.
# Nothing deletes it until you call discard_previous_stack. Set "false" to
# overwrite stacks in place.
keep_previous_stack_enabled = "true"
# "true" (the default): after an imaging stack is made, trim its edges back to
# where the pixel noise is within 15% of the middle's. Frames shift between
# nights, so the edges of a stack of several nights are covered by fewer
# frames and are noisier. A stack with clean edges is not changed. The
# rejection map is trimmed the same way. Set "false" to keep every edge.
trim_noisy_stack_edges_enabled = "true"
# "true" (the default): skip stacking a stack that would come out the same.
# A stack is skipped when its frames, the calibration frames chosen for them,
# the settings above and the stacking code are all unchanged since the stack on
# disk was made. Adding frames to one filter no longer rebuilds the other
# stacks of the target. To rebuild anyway, pass --force-restack to the batch
# script or force=True to run_stacking. Set "false" to rebuild every time.
skip_unchanged_stacks_enabled = "true"

["Processing.Parallelism"]
target_workers = "auto"
photometry_workers = "auto"
worker_niceness = "10"
# Max concurrent heavy jobs, system-wide. Shared by Siril stacking and
# photometry/spectroscopy analysis -- both draw on this one pool rather
# than being tuned separately. See
# astrometricslib/scripts/benchmark_siril_concurrency.py to measure the
# best value for this machine.
max_concurrent_jobs = "2"

["Frontend"]
enable_image_viewer = "true"
enable_image_processing = "true"
enable_command_console = "true"
enable_observatory = "true"
enable_planetarium = "true"
enable_astronomy = "true"
enable_observation = "false"
